name: Release

# Builds the downloadable desktop app for macOS and Windows and attaches the
# installers to a GitHub Release, so "download Cutroom" means grabbing a
# file from Releases rather than cloning the repo and running it from a
# terminal. Triggered by pushing a tag like v0.1.0.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      # One platform at a time: electron-builder's GitHub publish looks for
      # an existing draft release for the tag and adds its assets to it,
      # rather than creating a new one, only if that draft already exists
      # by the time it runs. Two platforms publishing in parallel raced this
      # check and created two separate draft releases instead of one.
      #
      # max-parallel: 1 does NOT fully close this -- on the v0.2.0 tag, the
      # two jobs still ran fully sequentially (confirmed from the Actions
      # log) and still ended up as two separate draft releases both tagged
      # v0.2.0, one holding the mac assets and the other the Windows ones.
      # Root cause not found (electron-builder's GitHub publisher not
      # reliably finding the other job's already-created draft, for reasons
      # this comment can't yet explain). Until this is actually fixed:
      # after tagging a release, check `gh api repos/OWNER/REPO/releases`
      # for exactly one release per tag with all 8 expected assets
      # (dmg/dmg.blockmap, mac zip/zip.blockmap, exe/exe.blockmap,
      # latest.yml, latest-mac.yml) before publishing (undrafting) it --
      # don't assume the workflow going green means the release is whole.
      # Recurred on v0.3.0 (2026-09-19): fixed by hand, uploading the
      # smaller draft's assets onto the other via the GitHub API, checking
      # each latest*.yml's sha512 against its installer, then deleting the
      # empty duplicate. See docs/STATUS.md's v0.3.0 entry.
      max-parallel: 1
      matrix:
        include:
          # Must match package.json's build.mac/build.win arch lists.
          # ffmpeg-static ships one binary per host arch (unlike
          # ffprobe-static, which bundles every arch and picks one at
          # runtime) chosen by os.arch() at install time -- left to that
          # default, this build would happily produce a working installer on
          # a runner whose default arch doesn't match the app's declared
          # target, and only fail for a real user, on their machine, with no
          # CI signal at all. Pinning it here makes that mismatch a CI
          # failure instead.
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
