[project]
name = "server"
version = "0.1.0"
description = "Local processing service: transcription, diarization, turn segmentation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=4.9,<5",
    "pillow>=12.3.0",
    "pyannote-audio>=4.0.7",
    "pysubs2>=1.8.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "setuptools<81",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
